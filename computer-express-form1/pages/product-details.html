<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Product Details | Computer Express</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="site-header"></div><main><div class="breadcrumb"><a href="products.html">Shop</a> / Product Details</div><section id="detail-root"></section></main><div id="site-footer"></div><script src="../js/products.js"></script><script src="../js/main.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{const id=new URLSearchParams(location.search).get("id")||"p1";const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];let qty=1;document.getElementById("detail-root").innerHTML=`<div class="detail-grid"><div class="detail-image glass">${p.icon}</div><div class="detail-content"><span class="eyebrow">${p.category}</span><h1>${p.name}</h1><div class="detail-price">${money(p.price)}</div><p class="detail-desc">${p.description}</p><div class="specs glass">${Object.entries(p.specs).map(([k,v])=>`<div class="spec-row"><span>${k}</span><b>${v}</b></div>`).join("")}</div><div class="quantity"><button class="qty-btn" id="minus">−</button><span class="qty-value" id="qty">1</span><button class="qty-btn" id="plus">+</button></div><button class="btn btn-primary" id="add" style="width:100%">Add to Cart</button></div></div>`;const q=document.getElementById("qty");document.getElementById("minus").onclick=()=>{qty=Math.max(1,qty-1);q.textContent=qty};document.getElementById("plus").onclick=()=>{qty=Math.min(p.stock,qty+1);q.textContent=qty};document.getElementById("add").onclick=()=>addToCart(p.id,qty);});
</script></body></html>
