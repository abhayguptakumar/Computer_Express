<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | Computer Express</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><span class="eyebrow">CHECKOUT</span><h1>Complete your order</h1><p>Form 1 uses a frontend-only checkout; real payment will be connected later.</p></section><div id="checkout-root"></div></main><div id="site-footer"></div><script src="../js/products.js"></script><script src="../js/main.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{const root=document.getElementById("checkout-root"),cart=getCart();if(!cart.length){root.innerHTML='<div class="empty glass"><h2>No items to checkout</h2><p>Add a product first.</p><a class="btn btn-primary" href="products.html">Shop Products</a></div>';return}let total=0;const items=cart.map(i=>{const p=PRODUCTS.find(x=>x.id===i.id);total+=p.price*i.qty;return `<div class="summary-item"><span>${p.name} × ${i.qty}</span><b>${money(p.price*i.qty)}</b></div>`}).join("");root.innerHTML=`<div class="checkout-grid"><form id="checkout-form" class="panel glass"><h2>Customer Details</h2><div class="form-grid"><div class="field"><label>Full Name</label><input class="input" required></div><div class="field"><label>Phone</label><input class="input" required></div><div class="field full"><label>Email</label><input class="input" type="email" required></div><div class="field full"><label>Address</label><textarea class="textarea" rows="4" required></textarea></div><div class="field"><label>City</label><input class="input" required></div><div class="field"><label>PIN Code</label><input class="input" required></div></div><button class="btn btn-primary" style="width:100%;margin-top:10px">Continue to Payment</button></form><aside class="panel glass"><h2>Order Summary</h2>${items}<div class="summary-total"><span>Total</span><span>${money(total)}</span></div></aside></div>`;document.getElementById("checkout-form").onsubmit=e=>{e.preventDefault();location.href="payment.html"}});
</script></body></html>
